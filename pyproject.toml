[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelineforge"
version = "0.1.0"
description = "Evidence-first REST, file, and PostgreSQL data integration starter"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "adapterproof==0.2.0",
  "deliveryguard==0.2.0",
  "dlt[duckdb,postgres,sql-database]==1.29.1",
  "fastapi==0.136.3",
  "Jinja2==3.1.6",
  "pandas==3.0.5",
  "pyarrow==25.0.0",
  "SQLAlchemy>=2.0,<2.1",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
airflow = ["apache-airflow==3.3.0"]
test = [
  "build>=1.3,<2",
  "httpx2==2.9.1",
  "mypy>=1.18,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.17",
  "twine>=6.2,<8",
]

[project.scripts]
pipelineforge = "pipelineforge.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pipelineforge*", "sql_database*"]

[tool.setuptools.package-data]
pipelineforge = ["templates/*.html"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["postgres: requires the explicit local PostgreSQL test URL"]

[tool.coverage.run]
branch = true
source = ["pipelineforge"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
files = ["src/pipelineforge"]
